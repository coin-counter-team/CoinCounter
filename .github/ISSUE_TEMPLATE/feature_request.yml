name: 기능 요청
description: 새 기능이나 작업을 제안하세요.
title: "[기능] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - 데이터·정답
        - 전처리
        - 검출
        - 특징·분류
        - 금액 계산
        - CNN
        - 평가
        - 문서·발표
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 무엇을, 왜 하려고 하나요?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 할 일
      placeholder: |
        - [ ] ...
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
