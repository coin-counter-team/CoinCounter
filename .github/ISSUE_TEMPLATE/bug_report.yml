name: 버그 제보
description: 잘못된 동작이나 오류를 알려주세요.
title: "[버그] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - 데이터·정답
        - 전처리
        - 검출
        - 특징·분류
        - 금액 계산
        - CNN
        - 평가
        - 문서·발표
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 어떤 문제가 생겼나요?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: |
        1. 실행 명령 ...
        2. 입력 이미지 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
  - type: textarea
    id: environment
    attributes:
      label: 환경
      placeholder: "OS, Python 버전, 촬영 조건 등"
